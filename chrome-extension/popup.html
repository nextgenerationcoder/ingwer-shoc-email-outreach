<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Form Outreach</title>
<style>
  body { font-family: -apple-system, sans-serif; width: 340px; margin: 0; padding: 1rem; color: #2c3c56; background: #f6f4d2; }
  h2 { font-size: 1rem; margin: 0 0 0.6rem; }
  .muted { color: #47597a; font-size: 0.8rem; }
  .card { background: #fffdf3; border: 1px solid #ece8b0; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.7rem; }
  label { display: block; font-weight: 700; font-size: 0.78rem; margin: 0.5rem 0 0.2rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 0.4rem; border: 1.5px solid #ece8b0; border-radius: 6px; font-size: 0.85rem; font-family: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  button { background: #2c3c56; color: #f6f4d2; border: none; padding: 0.5rem 0.9rem; border-radius: 999px; font-weight: 700; font-size: 0.82rem; cursor: pointer; margin-right: 0.4rem; margin-top: 0.5rem; }
  button.secondary { background: transparent; color: #2c3c56; border: 1.5px solid #2c3c56; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 0.8rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h2>Form Outreach</h2>
  <div id="content">Loading...</div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
