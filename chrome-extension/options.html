<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ingwer Shoc Form Outreach -- Settings</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 2rem auto; color: #2c3c56; background: #f6f4d2; }
  label { display: block; font-weight: 700; margin: 1rem 0 0.3rem; font-size: 0.85rem; }
  input { width: 100%; padding: 0.5rem; border: 1.5px solid #ece8b0; border-radius: 8px; box-sizing: border-box; font-size: 0.9rem; }
  button { margin-top: 1rem; background: #2c3c56; color: #f6f4d2; border: none; padding: 0.6rem 1.2rem; border-radius: 999px; font-weight: 700; cursor: pointer; }
  #status { margin-top: 0.8rem; font-size: 0.85rem; }
  h2 { font-size: 1.1rem; }
</style>
</head>
<body>
  <h2>Ingwer Shoc Form Outreach</h2>
  <p>Connect to your deployed dashboard. Find the API key on the dashboard's Settings page.</p>

  <label>Dashboard web address</label>
  <input id="baseUrl" placeholder="https://emailmarketing.amirseyti.de">

  <label>API key</label>
  <input id="apiKey" placeholder="paste from dashboard Settings page">

  <button id="save">Save</button>
  <button id="test" style="background:transparent;color:#2c3c56;border:1.5px solid #2c3c56">Test connection</button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
